---
repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: \.py$

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml

  - repo: local
    hooks:
      - id: check-example-config
        name: check example config schema
        # Run with the project venv: the editable install is always
        # current, unlike a cached hook env with a package snapshot.
        entry: env/bin/python tools/check_example_config.py
        language: system
        files: ^config\.example\.yaml$
