# Megingjord configuration example.
#
# Copy this file to ~/.config/megingjord/config.yaml and adjust it to
# your setup. Secrets are read from environment variables with the
# ${VAR} syntax; set them in your shell or in the systemd unit.
#
# The key and dial numbers are the map indices; each number may be
# claimed only once across the keys map.

# App-level logging configuration (not an integration section).
logging:
  level: info

streamdeck:
  theme: dracula
  dials:
    0:
      type: pulseaudio.sink
    1:
      type: brightness
    2:
      type: ha.entity
      entity_id: light.living_room
    3:
      type: pulseaudio.source
  keys:
    0:
      type: ha.alarm
      entity_id: alarm_control_panel.home
      arm_service: alarm_arm_night
    1:
      type: ha.entity
      entity_id: light.living_room
    2:
      type: ha.entity
      entity_id: light.kitchen
    3:
      type: ha.entity
      entity_id: switch.garage
    4:
      type: google_meet.tile
      action: mic
    5:
      type: google_meet.tile
      action: camera
    6:
      type: google_meet.phased_tile
      phases:
        lobby: start-next
        green_room: home
        green_room_switch: switch
        meeting: hand
        exit_hall: rejoin
    7:
      type: google_meet.phased_tile
      phases:
        lobby: start-instant
        green_room: enter
        green_room_switch: enter
        meeting: hangup
        exit_hall: home

home_assistant:
  url: wss://homeassistant.local/api/websocket
  token: ${HA_TOKEN}

pulseaudio:
  output_weights:
    - card:
        proplist:
          device.bus: pci
      port:
        name: analog-output-speaker
      weight: -10001
    - port:
        name: headset-output
      weight: 10001
  input_weights: []

google_meet:
